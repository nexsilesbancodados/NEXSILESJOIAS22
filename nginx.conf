# Configuração do nginx que serve o SPA em produção (Docker / EasyPanel).
#
# Cabeçalhos de segurança: o app não enviava nenhum. Os quatro primeiros não têm
# risco funcional. O CSP vai como Report-Only de propósito — o app carrega
# scripts de terceiros em runtime (SDK do Mercado Pago, Google Tag Manager,
# pixel do Facebook) e um CSP restritivo aplicado de primeira derrubaria o
# checkout. Confira o console do navegador por alguns dias; se não houver
# violação legítima, troque o nome do header para Content-Security-Policy.

server {
    listen 3000;
    listen [::]:3000;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Cabeçalhos de segurança
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera = leitor de código de barras (@zxing/browser)
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Content-Security-Policy-Report-Only "\
default-src 'self'; \
script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.mercadopago.com https://www.googletagmanager.com https://connect.facebook.net https://cdn.gpteng.co; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' data: https://fonts.gstatic.com https://cdn.gpteng.co; \
img-src 'self' data: blob: https:; \
connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.mercadopago.com https://viacep.com.br https://receitaws.com.br https://www.google-analytics.com https://*.facebook.com; \
frame-src https://sdk.mercadopago.com https://www.mercadopago.com.br; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self'" always;

    # ------------------------------------------------------------------
    # SPA + cache
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
